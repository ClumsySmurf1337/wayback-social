name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
      - run: node web/branding.test.js
      - run: node web/search-job.test.js
      - run: node web/turnstile.test.js
      - run: node web/auth.test.js
      - run: node web/auth-ui.test.js
      - run: node web/modes.test.js
      - run: node web/evidence-usage.test.js
      - run: node web/analytics.test.js
      - run: node web/console-timeout.test.js
      - run: node web/live-check.test.js
      - run: node web/osint-tools.test.js
      - run: node web/arquivo.test.js
      - run: node web/arquivo-gates.test.js
      - run: node web/arquivo-evidence.test.js
      - run: node web/url-alias.test.js
      - run: node web/url-mode.test.js
      - run: node web/ghostarchive.test.js
      - run: node web/commoncrawl.test.js
      - run: node web/dashboard-server.test.js
      - run: node functions/middleware.test.mjs
      - run: node functions/api/packs-upload.test.mjs
      - run: node functions/api/arquivo.test.mjs
      - run: node functions/api/ghostarchive.test.mjs
      - run: node functions/api/commoncrawl.test.mjs
      - run: node functions/api/live-check.test.mjs
      - run: node functions/api/evidence-usage.test.mjs
      - run: node functions/api/billing-portal.test.mjs
      - run: node functions/api/stripe-webhook.test.mjs
      - run: node functions/api/stripe-webhook-refunds.test.mjs
      - run: python scripts/sync_brands.py --check
      - run: python scripts/sync_config.py
      - run: wayback-social --help && wayback-social networks | head -5
