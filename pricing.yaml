# DeletedProof pricing — SINGLE SOURCE OF TRUTH (v1.3).
#
# To change a price or a cap: edit this file, then run:
#   python scripts/sync_pricing.py
# That regenerates wayback_social/plans.py (caps, features, labels) and
# web/config.js (PRICING, FEATURE_CHART, fee math). Never edit those
# generated blocks by hand — scripts/sync_pricing.py --check fails the
# build if they drift from this file.
#
# Launch pricing ends after 90 days or 500 buyers, then regular prices
# apply. Fees: Paddle 5% + 50c, Stripe 2.9% + 30c.
# Net kept = price * (1 - percent) - fixed.
#
# Bundle math (corrected in v1.3 — the v1.2 $137 / 57% was wrong):
#   regular total = Starter $19 + Pro $29 + Studio $99 = $147
#   launch bundle $59 is ($147 - $59) / $147 = 59.9% off, i.e. 60% off.
#
# Studio is a PACK with finite caps (John, 2026-11-26): 10 evidence-pack
# reports included, batch 200, 25,000 captures/search, 10,000 text
# fetches, 5 seats. No tier is sold as having no cap — never promise
# a cap-free tier in pricing copy.

launch:
  # WHY the discount exists, and HOW LONG it lasts — shown on the
  # pricing section and on every paid card (see renderPlans /
  # renderChart in web/console.js). No countdown is shown: there is
  # no backend buyer count, and the 90 days start at launch, so a
  # live timer would be invented. The plain-words end condition is
  # the honest version until checkout + sales counting exist.
  note: "Launch pricing — early-bird offer for our first buyers: launch prices end after the first 90 days or the first 500 buyers, whichever comes first — then regular prices apply."
  topup_price: 15
  topup_credits: 500

fees:
